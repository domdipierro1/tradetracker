<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#sheen)"/>

  <!-- Candlesticks rising (the trade) -->
  <g filter="url(#soft)">
    <!-- wick + body 1 -->
    <rect x="150" y="300" width="34" height="78" rx="10" fill="#FFFFFF" opacity="0.55"/>
    <rect x="163" y="278" width="8" height="122" rx="4" fill="#FFFFFF" opacity="0.55"/>
    <!-- wick + body 2 -->
    <rect x="239" y="232" width="34" height="120" rx="10" fill="#FFFFFF" opacity="0.78"/>
    <rect x="252" y="206" width="8" height="172" rx="4" fill="#FFFFFF" opacity="0.78"/>
    <!-- wick + body 3 (tallest) -->
    <rect x="328" y="160" width="34" height="150" rx="10" fill="#FFFFFF"/>
    <rect x="341" y="134" width="8" height="202" rx="4" fill="#FFFFFF"/>
  </g>

  <!-- Upward trend arrow connecting tops -->
  <path d="M150 318 L256 250 L345 168" fill="none" stroke="#A5B4FC" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M312 160 L352 156 L348 196" fill="none" stroke="#A5B4FC" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
